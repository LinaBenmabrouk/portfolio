name: Deploy AstroJS

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Deploy on Ubuntu server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}

          script: |
            set -e

            echo "======================================"
            echo "Début du déploiement"
            echo "======================================"

            cd /var/www/portfolio/portfolio

            echo "Mise à jour du code..."
            git pull origin

            echo "Installation des dépendances..."
            /home/etudiant/.bun/bin/bun ci

            echo "Compilation Astro..."
            /home/etudiant/.bun/bin/bun run --bun build

            echo "Redémarrage de l'application..."
            sudo systemctl restart portfolio

            echo "Vérification du service..."
            sudo systemctl status portfolio

            echo "Health check..."
            sleep 5
            curl --fail http://localhost:3010/

            # Visite chaque page du sitemap et demande toutes ses images (mobile et desktop) :
            # elles sont calculées maintenant, et prêtes avant le premier vrai visiteur
            echo "Préparation des images..."
            for page in $(curl -s http://localhost:3010/sitemap.xml | grep -o '<loc>[^<]*' | sed 's|<loc>https://portfolio.linabenmabrouk.fr||'); do
              for image in $(curl -s "http://localhost:3010$page" | grep -o '/_image?[^" ,]*' | sed 's/&#38;/\&/g; s/&amp;/\&/g' | sort -u); do
                curl -s -o /dev/null "http://localhost:3010$image"
              done
            done

            echo "======================================"
            echo "Déploiement terminé"
            echo "======================================"